<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Stuff — Northamptonshire</title>

    <link
        href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css"
        rel="stylesheet"
    >

    <script
        src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            color: #181818;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header {
            background: white;
            padding: 20px 24px;
            border-bottom: 1px solid #ddd;
            z-index: 2;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            color: #555;
        }

        #map {
            flex: 1;
            width: 100%;
            min-height: 500px;
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <h1>Free Stuff</h1>
        <p>
            Find genuinely free things to do around Northamptonshire.
        </p>
    </div>
</header>

<div id="map"></div>

<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiaGlkZGVubm9ydGhhbXB0b24iLCJhIjoiY211ZmIxNW00MDA3ODJ4cjZ4azMwdWc4diJ9.b6QQ2dWCEwxFUzsly5z-hw';

    const map = new mapboxgl.Map({
        container: 'map',

        style: 'mapbox://styles/mapbox/streets-v12',

        center: [
            -0.895,
            52.24
        ],

        zoom: 9
    });

    map.addControl(
        new mapboxgl.NavigationControl(),
        'top-right'
    );

map.on('load', () => {

    map.addSource('opportunities', {
        type: 'geojson',
        data: './opportunities.geojson'
    });

    map.addLayer({
        id: 'opportunity-points',
        type: 'circle',
        source: 'opportunities',

        paint: {
            'circle-radius': 8,
            'circle-stroke-width': 2,
            'circle-stroke-color': '#ffffff'
        }
    });

    map.on('click', 'opportunity-points', (event) => {

        const feature = event.features[0];
        const props = feature.properties;

        const start = props.start_at
            ? new Date(props.start_at).toLocaleString('en-GB')
            : 'Time not available';

        const booking = props.booking_required
            ? 'Booking required'
            : 'No booking requirement identified';

        new mapboxgl.Popup()
            .setLngLat(feature.geometry.coordinates)
            .setHTML(`
                <strong>${props.title}</strong>
                <br><br>
                ${start}
                <br>
                ${props.address}
                <br><br>
                ${booking}
                <br><br>
                <a href="${props.source_url}"
                   target="_blank"
                   rel="noopener">
                    View original listing
                </a>
            `)
            .addTo(map);
    });

    map.on(
        'mouseenter',
        'opportunity-points',
        () => {
            map.getCanvas().style.cursor = 'pointer';
        }
    );

    map.on(
        'mouseleave',
        'opportunity-points',
        () => {
            map.getCanvas().style.cursor = '';
        }
    );
});
    
</script>

</body>
</html>
